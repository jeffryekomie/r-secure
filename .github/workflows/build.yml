name: Build R Secure APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      - name: Générer le projet Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Compiler l’APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Préparer le fichier APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk R-Secure.apk

      - name: Publier l’artefact temporaire
        uses: actions/upload-artifact@v4
        with:
          name: r-secure-apk
          path: R-Secure.apk
          retention-days: 7

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r-secure-${{ github.run_number }}
          name: R Secure - Build ${{ github.run_number }}
          files: R-Secure.apk
          generate_release_notes: true
